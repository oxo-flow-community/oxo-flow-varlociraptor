# Varlociraptor — pinned to the upstream envs/varlociraptor.yaml (v6.11.4:
# varlociraptor 8.12.0) with one deviation: vega-lite-cli is a conda-forge
# package and 5.16 is no longer on the channel (live: PackagesNotFoundError
# on env setup), so it is pinned to conda-forge::6.4.3.
name: varlociraptor
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::varlociraptor=8.12.0
  - conda-forge::vega-lite-cli=6.4.3
  - bioconda::bcftools=1.21
