# freebayes — pinned to the freebayes v2.7.0 wrapper environment plus the
# sed/gawk chain of the freebayes-parallel region preprocessing.
name: freebayes
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::freebayes=1.3.6
  - bioconda::bcftools=1.15
  - bioconda::vcflib=1.0.3
  - bioconda::htslib=1.16
  - conda-forge::parallel=20230722
  - bioconda::bedtools=2.31.0
  - conda-forge::sed=4.8
